<body>
<div id="root"><div class="boot">Lade deine Daten …</div></div>

<style>
  :root{
    --bg:#0A0D11; --surface:#15191F; --surface2:#1E242B; --line:#2A323B;
    --text:#F1F4F7; --muted:#8B97A0;
    --primary:#6366F1; --primary-d:#4F46E5;
    --green:#22C55E; --amber:#F59E0B; --red:#EF4444; --info:#38BDF8; --run:#2DD4BF;
    --today:#FF4D4D; --acc:#22C55E;
    --r:17px;
    font-synthesis-weight:none;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  #root{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text); background:var(--bg);
    max-width:560px; margin:0 auto; min-height:100vh;
    padding:0 0 96px; line-height:1.45; letter-spacing:-0.01em;
  }
  .boot{padding:80px 24px; text-align:center; color:var(--muted); font-family:system-ui;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}

  header.app{
    position:sticky; top:0; z-index:20; background:rgba(14,17,22,.86);
    backdrop-filter:saturate(140%) blur(12px); border-bottom:1px solid var(--line);
    padding:14px 18px 12px; padding-top:max(14px,env(safe-area-inset-top));
  }
  header.app .eyebrow{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  header.app h1{margin:2px 0 0; font-size:21px; font-weight:800; letter-spacing:-0.02em;}
  header.app .date{float:right; font-size:12px; color:var(--muted); margin-top:6px;}

  main{padding:16px 16px 0;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:14px;}
  .card h2{margin:0 0 4px; font-size:13px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:700;}

  /* readiness gate */
  .gate{display:flex; gap:8px; margin-bottom:10px;}
  .gate button{flex:1; border:1px solid var(--line); background:var(--surface2); color:var(--text);
    padding:12px 6px; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; transition:.15s;}
  .gate button .dot{display:block; width:12px;height:12px;border-radius:50%;margin:0 auto 6px;}
  .gate button[data-k=green] .dot{background:var(--green);}
  .gate button[data-k=amber] .dot{background:var(--amber);}
  .gate button[data-k=red] .dot{background:var(--red);}
  .gate button.on[data-k=green]{border-color:var(--green); box-shadow:0 0 0 1px var(--green) inset; background:rgba(34,197,94,.10);}
  .gate button.on[data-k=amber]{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset; background:rgba(245,158,11,.10);}
  .gate button.on[data-k=red]{border-color:var(--red); box-shadow:0 0 0 1px var(--red) inset; background:rgba(239,68,68,.10);}
  .gate-msg{font-size:13.5px; color:var(--text); background:var(--surface2); border-radius:10px; padding:10px 12px; border-left:3px solid var(--line);}
  .gate-msg.green{border-left-color:var(--green);}
  .gate-msg.amber{border-left-color:var(--amber);}
  .gate-msg.red{border-left-color:var(--red);}
  .gate-msg ul{margin:6px 0 0; padding-left:18px;} .gate-msg li{margin:2px 0;}
  .gate-msg.opt{border-left-color:#8B5CF6;}
  .gate-msg.info{border-left-color:var(--info);}

  .sub{font-size:12px; color:var(--muted); margin:-2px 0 12px;}
  .zlabel{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:7px;}
  .zones{display:flex; gap:5px; margin-bottom:10px;}
  .zb{flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:7px 1px 6px; cursor:pointer; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:3px;}
  .zb .zbar{width:80%; height:4px; border-radius:3px; background:var(--zc); opacity:.45;}
  .zb .zl{font-size:11px; font-weight:700; line-height:1;}
  .zb .zr{font-size:9px; color:var(--muted);}
  .zb.on{border-color:var(--zc); box-shadow:0 0 0 1px var(--zc) inset;}
  .zb.on .zbar{opacity:1;}
  .feels{display:flex; gap:5px; margin-bottom:10px;}
  .fb{flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:8px 1px 6px; cursor:pointer; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:2px;}
  .fb .fe{font-size:18px; line-height:1;}
  .fb .fl{font-size:10px; color:var(--muted);}
  .fb.on{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset; background:rgba(99,102,241,.12);}
  .fb.on .fl{color:var(--text);}
  .notein{width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 12px; font-size:15px;}
  .notein:focus{outline:none; border-color:var(--primary);}
  .zdot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle;}

  .deload{background:rgba(255,77,77,.14); border:1px solid var(--today); border-left:5px solid var(--today); color:#FFDADA;
    border-radius:13px; padding:14px 15px; font-size:14px; font-weight:600; margin-bottom:14px; box-shadow:0 0 0 3px rgba(255,77,77,.08);}
  .deload b{color:#fff; font-weight:800;}
  .cycleb{background:rgba(255,77,77,.13); border:1px solid var(--today); border-left:5px solid var(--today); color:#FFDADA;
    border-radius:13px; padding:14px 15px; font-size:14px; font-weight:600; margin-bottom:14px; box-shadow:0 0 0 3px rgba(255,77,77,.08);}
  .cycleb b{color:#fff; font-weight:800;}
  .cystat{font-size:12.5px; color:var(--muted); margin-top:8px; padding-top:8px; border-top:1px solid var(--line);}
  .card.ex.deload{border-color:rgba(56,189,248,.5);}
  .save.ghost{background:transparent; border:1px solid var(--primary); color:var(--primary);}
  .modalq{max-width:380px; max-height:82vh; overflow-y:auto; background:#15191F; color:#F1F4F7;}
  .modalq .mmsg, .modalq .qq, .modalq b{color:#F1F4F7;}
  .modalq .s, .modalq .godesc{color:#C3CBD3 !important;}
  .modalq .godesc b{color:#fff;}
  .qblock{margin-bottom:12px;}
  .qq{font-size:13.5px; font-weight:700; margin-bottom:7px;}
  .qopts{display:flex; flex-wrap:wrap; gap:7px;}
  .qopt{font-size:12.5px; padding:8px 11px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--text); cursor:pointer;}
  .qopt.on{border-color:var(--primary); background:rgba(99,102,241,.16); color:#C7D2FE;}
  .qrec{margin-top:8px; padding:12px; border:1px solid var(--primary); border-radius:12px; background:rgba(99,102,241,.08);}
  .qrecname{font-size:16px; font-weight:800; margin:2px 0 4px;}
  .rec.deload{background:rgba(56,189,248,.16); color:#BAE6FD;}

  .daterow{display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .drlab{font-size:13px; font-weight:700; color:var(--muted);}
  .dateinp{flex:1; background:var(--surface2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:15px; font-family:ui-monospace,Menlo,monospace;}
  .dateinp:focus{outline:none; border-color:var(--primary);}
  .backfill{font-size:11px; font-weight:700; color:#08293b; background:var(--info); padding:4px 9px; border-radius:999px;}

  .upbanner{background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.5); border-radius:14px; padding:12px 14px; margin-bottom:14px;}
  .upbanner .ut{font-size:13px; font-weight:800; color:var(--green); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .upbanner .uprow{display:flex; justify-content:space-between; font-size:14px; padding:3px 0;}
  .upbanner .uprow .mono{color:var(--green); font-weight:700;}

  .navbadge{position:absolute; top:-5px; right:-9px; min-width:15px; height:15px; padding:0 4px; background:var(--green);
    color:#04210f; font-size:10px; font-weight:800; border-radius:999px; display:flex; align-items:center; justify-content:center; line-height:1;}
  nav.tabs button .ic{position:relative;}

  .prefnote{font-size:12px; color:var(--green); background:rgba(34,197,94,.10); border-radius:8px; padding:7px 10px; margin-top:8px;}
  .prefnote.down{color:#FB923C; background:rgba(251,146,60,.10);}

  function dbDefaultFor(pat, prefName){

  function ensureEx(pat, prefName, sets, lo, hi){

    } else { const ex=state.exercises[id]; if(!ex.pat)ex.pat=pat; if(sets)ex.sets=sets; if(lo)ex.repMin=lo; if(hi)ex.repMax=hi; }
    return id;
  }

  // ---------- Periodisierungs-Modelle ----------
  const MODELS={
    dp:{name:"Double Progression + Deload", cx:"Sehr niedrig", build:3, deload:1,
      short:"Frei steigern: erst Wiederholungen in der Range hochbringen, dann Gewicht – plus fester Deload alle 4 Wochen. Am einfachsten, ideal für Anfänger & Wiedereinstieg.",
      sci:"Autoregulative Steigerung über die Wiederholungs-Range; der getaktete Deload beugt schleichender Ermüdung vor. Quellen: ACSM Position Stand (2009); Helms et al. (RIR/RPE-Steuerung)."},
    linear:{name:"Lineare Periodisierung", cx:"Niedrig", build:3, deload:1,
      short:"Über die Wochen wird der Bereich schwerer: erst viele Wiederholungen / wenig Last, dann wenige Wiederholungen / viel Last. Klarer Bogen Richtung Kraft.",
      sci:"Klassisch: Volumen sinkt, Intensität steigt über den Block. Gut für Einsteiger/Mittelstufe mit Zieltermin. Gewicht je Phase aus deinem geschätzten 1RM. Quellen: ACSM (2009); NSCA Essentials; Williams et al. (2017, Meta-Analyse linear vs. undulierend)."},
    dup:{name:"Undulierende Periodisierung (DUP)", cx:"Mittel", build:3, deload:1,
      short:"Schwere, moderate und leichte Tage wechseln sich ab – der Reiz variiert von Einheit zu Einheit. Hält den Fortschritt frisch, wenn reine Progression langsamer wird.",
      sci:"Daily Undulating Periodization variiert Wiederholungen/Intensität pro Einheit statt über Wochen. Für Fortgeschrittene oft leicht überlegen, Unterschied zu linear meist klein. Quellen: Rhea et al. (2002); Williams et al. (2017, Meta-Analyse)."},
    meso:{name:"Voller Mesozyklus", cx:"Hoch", build:3, deload:1,
      short:"Durchgeplanter Block: RIR Woche für Woche näher ans Limit, Oberkörper-Volumen rauf, dann Deload. Für Fortgeschrittene, die das Maximum rausholen wollen.",
      sci:"Volumen-/Block-Periodisierung mit Volumen-Landmarks (MEV→MAV→MRV) und steigender Anstrengung, gefolgt von Entlastung. Quellen: Issurin (Block-Periodisierung); Schoenfeld et al. (Volumen); Israetel/Renaissance Periodization."},
  };
  const UPPER=new Set(["Brust","Rücken","Schultern","hintere Schulter","Bizeps","Trizeps"]);
  function mondayStr(ds){const d=new Date(ds+"T12:00:00"); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10);}
  function roundInc(v,inc){inc=inc||2.5; return Math.round((Math.round(v/inc)*inc)*100)/100;}
  function bestE1RM(exId){ let m=null;
    state.sessions.forEach(s=>(s.entries||[]).forEach(e=>{ if(e.exerciseId!==exId)return;
      e.sets.forEach(x=>{ if(x.weight!=null&&x.reps!=null){const v=epley(x.weight,x.reps); if(m==null||v>m)m=v;}});}));
    return m; }
  function cycleInfo(refDate){
    const cy=state.cycle; if(!cy||!cy.on) return null;
    const model=cy.model||"meso";
    const build=cy.build||3, dedays=cy.deload||1, total=build+dedays;
    const start=cy.start||mondayStr(todayStr());
    const ref=refDate||logDate();
    const days=Math.floor((new Date(ref+"T12:00:00")-new Date(start+"T12:00:00"))/864e5);
    let widx=Math.floor((days<0?0:days)/7)%total; widx=(widx+total)%total;
    const week=widx+1, isDeload=week>build;
    const ci={model,week,total,build,isDeload,phase:isDeload?"deload":"aufbau",label:"Aufbau",targetRIR:null};
    if(isDeload){ ci.label="Deload"; ci.targetRIR=4; return ci; }
    if(model==="meso"){
      ci.targetRIR = build>1?Math.max(1,Math.min(3,Math.round(3-(week-1)*(2/(build-1))))):2;
      ci.volAdd = week-1;
    } else if(model==="linear"){
      const f = build>1 ? (week-1)/(build-1) : 0;
      const repHi = Math.round(15 - f*9), repLo = Math.max(3, Math.round(15-f*9)-3);
      ci.repRange=[repLo,repHi]; ci.pct=Math.round(65 + f*17);
      ci.label = f<0.34?"Hypertrophie": f<0.67?"Aufbau":"Kraft";
    } else if(model==="dup"){
      const types=[{r:[4,6],p:82,l:"Schwer"},{r:[8,10],p:72,l:"Moderat"},{r:[12,15],p:65,l:"Leicht"}];
      let idx=state.plans.findIndex(p=>p.id===state.ui.planId); if(idx<0)idx=0;
      const t=types[((idx%3)+3)%3]; ci.repRange=t.r; ci.pct=t.p; ci.label=t.l;
    }
    return ci;
  }
  function phaseFor(ex, ci){
    const base={repMin:ex.repMin,repMax:ex.repMax,sets:ex.sets,pct:null,suggW:null,deload:false,
      label:ci?ci.label:null,targetRIR:ci?ci.targetRIR:null,model:ci?ci.model:null};
    if(!ci) return base;
    if(ci.isDeload){ base.sets=Math.max(1,Math.floor(ex.sets*0.6)); base.deload=true; return base; }
    if(ci.model==="meso"){ if(UPPER.has(ex.muscle)) base.sets=ex.sets+(ci.volAdd||0); return base; }
    if((ci.model==="linear"||ci.model==="dup") && ci.repRange && !ex.bodyweight && ex.mode!=="time"){
      base.repMin=ci.repRange[0]; base.repMax=ci.repRange[1]; base.pct=ci.pct;
      const e1=bestE1RM(ex.id); if(e1!=null && ci.pct) base.suggW=roundInc(e1*ci.pct/100, ex.increment||2.5);
    }
    return base;
  }
  function effectiveSets(ex){ return phaseFor(ex, cycleInfo()).sets; }

  function recommend(exId){
    const ex=state.exercises[exId]; const ci=cycleInfo(); const ph=phaseFor(ex, ci);
    if(ph.deload){ return {cls:"deload",label:"Deload",
      note:`Deload-Woche: weniger Sätze, RIR ~${ci.targetRIR}, Gewicht halten oder ~10 % leichter. Diese Woche nicht steigern — Erholung priorisieren.`}; }
    const ovr=(ci&&(ph.repMin!==ex.repMin||ph.repMax!==ex.repMax))?{repMin:ph.repMin,repMax:ph.repMax}:null;
    const R=recommendBase(exId, ovr);
    if(ci&&R&&R.cls!=="neu"){
      if(ci.model==="meso") R.note += ` · Ziel-RIR diese Woche: ${ci.targetRIR}.`;
      else if((ci.model==="linear"||ci.model==="dup")&&ph.pct) R.note += ` · Phase „${ci.label}": ${ph.repMin}–${ph.repMax} Wdh @ ~${ph.pct} % 1RM${ph.suggW?` (~${ph.suggW} kg)`:""}.`;
    }
    return R;
  }
  function recommendBase(exId, ovr){
    const ex=state.exercises[exId];
    const rMin=ovr?ovr.repMin:ex.repMin, rMax=ovr?ovr.repMax:ex.repMax;
    const isTime=ex.mode==="time";
    const U=isTime?"s":"Wdh."; const word=isTime?"Zeit":"Wdh.";
    const last=lastEntry(exId);
    if(!last||!last.sets.length){ return {cls:"neu",label:"Erste Einheit",
      note: ex.bodyweight? `Start: ${ex.sets}×${ex.repMin}–${ex.repMax} ${U} sauber${isTime?"":", Exzentrik betont"}.`
        : `Start bei ~${ex.lastWeight!=null?ex.lastWeight+" kg":"deinem Arbeitsgewicht"} · Zielbereich ${ex.repMin}–${ex.repMax} ${U}.`}; }
    const vals=last.sets.map(s=>isTime?s.secs:s.reps).filter(n=>n!=null&&!isNaN(n));
    if(!vals.length) return {cls:"neu",label:"—",note:`Keine ${word} erfasst.`};
    const minV=Math.min(...vals);
    const allTop=vals.every(r=>r>=rMax);
    const rirs=last.sets.map(s=>s.rir).filter(n=>n!=null&&!isNaN(n));
    const lowRIR = rirs.length? rirs.every(r=>r<=1) : true;
    const w=last.sets.map(s=>s.weight).filter(n=>n!=null);
    const topW=w.length?Math.max(...w):ex.lastWeight;

    if(ex.bodyweight){
      if(allTop) return {cls:"steigern",label:isTime?"Länger / schwerer":"Schwerer machen",
        note:`Alle Sätze ≥ ${rMax} ${U} → ${isTime?"Zeit erhöhen oder Zusatzlast":"Exzentrik verlangsamen / Stütz reduzieren / Zusatzlast"}.`};
      return {cls:"aufbau",label:isTime?"Zeit aufbauen":"Wdh. aufbauen",note:`Ziel: alle Sätze auf ${rMax} ${U} bringen.`};
    }
    if(allTop && lowRIR){
      const next=round((topW||0)+ex.increment);
      return {cls:"steigern",label:`Steigern → ${next} kg`, nextW:next,
        note:`Alle Sätze auf ${rMax} ${U} bei niedrigem RIR. Nächste Einheit ${next} kg, ${word} zurück auf ${rMin}.`};
    }
    if(allTop && !lowRIR){
      return {cls:"aufbau",label:"Fast — noch halten",
        note:`Obere ${word} erreicht, aber RIR noch hoch. Gleiche Last, näher ans Limit, dann steigern.`};
    }
    if(minV>=rMin){
      return {cls:"aufbau",label:isTime?"Zeit aufbauen":"Wdh. aufbauen",
        note:`Im Zielbereich (${rMin}–${rMax} ${U}). Gleiche Last, ${word} Richtung ${rMax} schieben.`};
    }
    // Unter der Range: Regression prüfen (Last zu hoch?)
    const belowCount = vals.filter(r=>r<rMin).length;
    const worstShort = rMin - minV;
    // geschätztes 1RM aus den Sätzen (Epley + RIR: Wdh. bis Versagen = Wdh. + RIR)
    let e1=null; last.sets.forEach(s=>{ if(s.weight!=null&&s.reps!=null){ const rtf=s.reps+(s.rir!=null?s.rir:0); const e=s.weight*(1+rtf/30); if(e1==null||e>e1)e1=e; }});
    const tooHeavy = !isTime && e1!=null && (worstShort>=2 || belowCount>=Math.ceil(vals.length/2));
    if(tooHeavy){
      // Zielgewicht: rMax Wdh. bei ~2 RIR -> über mehrere Sätze in der Range
      const targetRTF = rMax + 2;
      let nw = roundInc(e1/(1+targetRTF/30), ex.increment);
      if(topW!=null) nw = Math.min(nw, roundInc(topW-ex.increment, ex.increment)); // mind. eine Stufe unter dem schwersten Satz
      if(nw<=0) nw = ex.increment;
      return {cls:"regress", label:`Reduzieren → ${nw} kg`, nextW:nw,
        note:`Wdh. fallen unter ${rMin} (z.B. nur ${minV}) — Last zu hoch für saubere Sätze in der Range. Nächste Einheit ${nw} kg, damit alle Sätze in ${rMin}–${rMax} ${U} bei ~1–2 RIR landen.`};
    }
    return {cls:"halten",label:"Gewicht halten",
      note:`Knapp unter ${rMin} ${U} in einem Satz. Last halten, bis alle Sätze ≥ ${rMin} ${U} sauber sind.`};
  }
  function lastEntry(exId){
    let best=null,bestDate="";
    for(const s of state.sessions){
      const e=(s.entries||[]).find(x=>x.exerciseId===exId);
      if(e&&e.sets&&e.sets.length && s.date>=bestDate){ best=e; bestDate=s.date; }
    }
    return best;
  }
  function epley(w,r){ return w*(1+r/30); }

  // ---------- week helpers ----------
  function weekRange(off){
    const d=new Date(); d.setHours(0,0,0,0);
    const day=(d.getDay()+6)%7; // Mon=0
    const mon=new Date(d); mon.setDate(d.getDate()-day+off*7);
    const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    return {mon,sun};
  }
  const fmtD=d=>d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
  function inWeek(dateStr,r){ const d=new Date(dateStr+"T12:00:00"); return d>=r.mon&&d<=new Date(r.sun.getFullYear(),r.sun.getMonth(),r.sun.getDate(),23,59); }

  function tabBtn(id,ic,lab){

  // ----- HEUTE -----
  function viewHeute(){
    const ld=logDate(), isToday=ld===todayStr();
    const simple=state.ui.simple;

    const dateRow=`<div class="card daterow">

    const extraCards = extra.length? `<div class="adhoc-h">Zusätzlich · nur heute</div>`+extra.map(exCard).join("") : "";
    const pickList = Object.keys(state.exercises).filter(id=>!exs.includes(id)).sort((a,b)=>state.exercises[a].name.localeCompare(state.exercises[b].name,"de"))
      .map(id=>`<span class="chip ${extra.includes(id)?"on":""}" data-extra="${id}">${extra.includes(id)?"✓ ":"+ "}${esc(state.exercises[id].name)}</span>`).join("");
    const adhoc = exs.length? `<details class="add adhoc"><summary>+ Übung nur für heute</summary><div style="margin-top:8px">${pickList||'<span class="s" style="color:var(--muted)">Keine weiteren Übungen vorhanden.</span>'}</div></details>`:"";
    const editingDay = state.sessions.some(s=>s.date===ld && s.planId===state.ui.planId);
    const saveBtn = (exs.length||extra.length)? `<button class="save" id="saveSession">${editingDay?"Einheit aktualisieren":(isToday?"Einheit speichern":"Einheit nachtragen")}</button>`:"";
    const trainHead=`<div class="sec-h"><span>Heutiges Training</span>${plan?`<span class="sec-sub">${esc(plan.name)}</span>`:""}</div>`;
    return weekStrip()+checkinCard(ld)+dateRow+goalB+deload+trainHead+seg+banner+cards+skipNote+extraCards+adhoc+saveBtn;
  }
  function greetWord(){ const h=new Date().getHours(); return h<5?"Gute Nacht":h<11?"Guten Morgen":h<17?"Guten Tag":"Guten Abend"; }

  // ----- VERLAUF -----
  const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;}
  function isoWeekNum(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-day+3);const f=new Date(Date.UTC(x.getUTCFullYear(),0,4));return 1+Math.round(((x-f)/864e5-3+((f.getUTCDay()+6)%7))/7);}
  function buckets(tf){
    const now=new Date(); const arr=[];
    if(tf==="woche"){ const mon=mondayOf(now);
      for(let i=11;i>=0;i--){const m=new Date(mon);m.setDate(mon.getDate()-i*7);const e=new Date(m);e.setDate(m.getDate()+6);e.setHours(23,59,59);
        arr.push({label:"KW"+isoWeekNum(m),start:m,end:e});} }
    else if(tf==="monat"){ for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const e=new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59);
        arr.push({label:MON[d.getMonth()]+(d.getMonth()===0?"’"+String(d.getFullYear()).slice(2):""),start:d,end:e});} }
    else { const ys=now.getFullYear(); for(let y=ys-4;y<=ys;y++) arr.push({label:""+y,start:new Date(y,0,1),end:new Date(y,11,31,23,59,59)}); }
    return arr;
  }
  function inB(dateStr,b){const d=new Date(dateStr+"T12:00:00");return d>=b.start&&d<=b.end;}

  const WINDOW={woche:7,monat:31,jahr:365};
  const dms=ds=>new Date(ds+"T12:00:00").getTime();

  // echte Achsen-Grafik: Zeit (X) × Wert (Y), bis zu 2 Y-Achsen (links/rechts, Garmin-Stil)
  function axChart(seriesDefs, windowDays){
    seriesDefs=seriesDefs.filter(s=>s.points&&s.points.length);
    if(!seriesDefs.length) return `<div class="empty">Noch keine Daten im Zeitraum.</div>`;
    const W=340,H=208,T=12,B=26, hasR=seriesDefs.length>=2, L=44, R=hasR?44:14;
    const plotW=W-L-R, plotH=H-T-B;
    const now=Date.now(), tmin=now-windowDays*864e5, tmax=now;
    const xat=t=>{const tt=Math.max(tmin,Math.min(tmax,t)); return L+((tt-tmin)/(tmax-tmin))*plotW;};
    seriesDefs.forEach(s=>{const ys=s.points.map(p=>p.y); let mn=Math.min(...ys),mx=Math.max(...ys);
      if(mn===mx){mn-=Math.abs(mn)*0.06+1; mx+=Math.abs(mx)*0.06+1;} const pad=(mx-mn)*0.14; s.mn=mn-pad; s.mx=mx+pad;});
    const ymap=(v,s)=>{let b=(v-s.mn)/(s.mx-s.mn); if(s.invert)b=1-b; return T+(1-b)*plotH;};
    const ax=lbl=>String(lbl).replace("/km","").replace("/100m","").replace("/h","");
    let svg="";
    for(let g=0;g<=3;g++){const y=(T+g*(plotH/3)).toFixed(1); svg+=`<line x1="${L}" y1="${y}" x2="${L+plotW}" y2="${y}" stroke="#2C343D" stroke-width="1"/>`;}
    const axisLab=(s,x,anchor)=>{let out=""; for(let g=0;g<=3;g++){let base=1-g/3; if(s.invert)base=1-base;
      const val=s.mn+base*(s.mx-s.mn), y=(T+g*(plotH/3)+3).toFixed(1);
      out+=`<text x="${x}" y="${y}" fill="${s.color}" font-size="8.5" text-anchor="${anchor}" font-family="ui-monospace,monospace">${esc(ax(s.fmt(val)))}</text>`;} return out;};
    svg+=axisLab(seriesDefs[0], L-5, "end");
    if(hasR) svg+=axisLab(seriesDefs[1], L+plotW+5, "start");
    const fmtX=t=>{const d=new Date(t); return windowDays<=31? d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}) : d.toLocaleDateString("de-DE",{month:"short"});};
    [0,0.5,1].forEach(f=>{const t=tmin+f*(tmax-tmin), x=(L+f*plotW).toFixed(1);
      svg+=`<text x="${x}" y="${H-8}" fill="#94A0A8" font-size="8.5" text-anchor="${f===0?"start":f===1?"end":"middle"}" font-family="ui-monospace,monospace">${fmtX(t)}</text>`;});
    seriesDefs.forEach(s=>{const pts=s.points.slice().sort((a,b)=>a.t-b.t);
      let dpath="",started=false,dots="";
      pts.forEach(p=>{const x=xat(p.t),y=ymap(p.y,s); dpath+=(started?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" "; started=true;
        dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${s.color}"/>`;});
      svg+=`<path d="${dpath}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;});
    const legend=`<div class="legend">${seriesDefs.map(s=>{const last=s.points[s.points.length-1];
      return `<span class="lg"><span class="lgdot" style="background:${s.color}"></span>${esc(s.name)}${last?` · <b>${esc(s.fmt(last.y))}</b>`:""}</span>`;}).join("")}</div>`;
    return legend+`<svg class="bigchart" viewBox="0 0 ${W} ${H}">${svg}</svg>`;
  }

    const defs=[
      {key:"e1rm",name:"gesch. 1RM",color:"#6366F1",fmt:v=>Math.round(v)+" kg",
        calc:v=>{let m=null;v.forEach(x=>{const e=epley(x.weight,x.reps);if(m==null||e>m)m=e;});return m;}},
      {key:"top",name:"Top-Gewicht",color:"#22C55E",fmt:v=>round(v)+" kg",
        calc:v=>{let m=null;v.forEach(x=>{if(x.weight!=null&&(m==null||x.weight>m))m=x.weight;});return m;}},
      {key:"vol",name:"Volumen",color:"#F59E0B",fmt:v=>Math.round(v)+" kg",
        calc:v=>{let t=0,any=false;v.forEach(x=>{if(x.weight!=null&&x.reps!=null){t+=x.weight*x.reps;any=true;}});return any?t:null;}},

    const sel=state.ui.kMetrics, wd=WINDOW[state.ui.tf], cutoff=Date.now()-wd*864e5;

    const toggles=`<div class="mtoggles">${defs.map(d=>`<span class="mtog ${sel.includes(d.key)?"on":""}" data-kmetric="${d.key}" style="--mc:${d.color}"><span class="mdot"></span>${d.name}</span>`).join("")}</div>`;
    return `<div class="card">

        ${toggles}
        ${axChart(seriesDefs, wd)}
        <div class="chartnote">Zeit auf der X-Achse, Werte auf der Y-Achse (links 1. Kennzahl, rechts 2.). Jeder Punkt = eine Einheit.</div>
      </div>`;

  // ----- 1RM calculator (scientific) -----
  function view1RM(){
    const w=state.ui.rmW!=null?state.ui.rmW:50, r=state.ui.rmR!=null?state.ui.rmR:5;
    const valid = w>0 && r>=1 && r<=12;
    const F = valid? {
      "Epley": w*(1+r/30),
      "Brzycki": w*36/(37-r),
      "Lombardi": w*Math.pow(r,0.10),
      "O’Conner": w*(1+0.025*r),
      "Wathan": 100*w/(48.8+53.8*Math.exp(-0.075*r)),
      "Mayhew": 100*w/(52.2+41.9*Math.exp(-0.055*r)),
    } : {};
    const vals=Object.values(F);
    const avg = vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    const lo=vals.length?Math.min(...vals):0, hi=vals.length?Math.max(...vals):0;
    const pct=[[1,1.00],[2,0.95],[3,0.92],[4,0.89],[5,0.86],[6,0.83],[8,0.78],[10,0.74],[12,0.70]];
    const fRows=Object.keys(F).map(k=>`<div class="row"><div class="l">${k}</div><div class="v">${Math.round(F[k])} kg</div></div>`).join("");
    const pRows=pct.map(([reps,p])=>`<div class="row"><div class="l">${reps} Wdh.</div><div class="s">${Math.round(p*100)} %</div><div class="v">${avg?(Math.round(avg*p*2)/2)+" kg":"—"}</div></div>`).join("");
    return `
      <div class="card">
        <h2>1RM-Rechner</h2>
        <div class="sub">Schätzt dein Maximalgewicht aus einem Satz. Am genauesten bei ≤ 6 Wdh.</div>
        <div class="grid2">
          <div class="field"><label>Gewicht (kg)</label><input id="rmW" class="mono" inputmode="decimal" value="${w}"></div>
          <div class="field"><label>Wiederholungen</label><input id="rmR" class="mono" inputmode="numeric" value="${r}"></div>
        </div>
        ${valid?`<div class="rmbig"><div class="rmnum mono">${Math.round(avg)} kg</div><div class="rmlab">geschätztes 1RM (Mittel aus ${vals.length} Formeln)</div>
          <div class="rmrange mono">Spanne ${Math.round(lo)}–${Math.round(hi)} kg</div></div>`
          :`<div class="empty">Gewicht eingeben und 1–12 Wdh. wählen.</div>`}
      </div>
      ${valid?`<div class="card"><h2>Einzelne Formeln</h2>${fRows}</div>
      <div class="card"><h2>Trainingsgewichte (% des 1RM)</h2>
        <div class="sub">Richtwerte für deine Arbeitssätze.</div>${pRows}</div>`:""}`;
  }

  // ----- WOCHE -----
  function viewWoche(){
    const off=state.ui.weekOffset, r=weekRange(off);
    const ses=state.sessions.filter(s=>inWeek(s.date,r));
    const runs=state.runs.filter(x=>inWeek(x.date,r));
    const km=runs.reduce((a,b)=>a+b.km,0);
    let tonnage=0, setsByMuscle={};
    ses.forEach(s=>(s.entries||[]).forEach(e=>{
      const ex=state.exercises[e.exerciseId]; if(!ex)return;
      e.sets.forEach(st=>{ if(st.weight!=null&&st.reps!=null)tonnage+=st.weight*st.reps; });
      const done=e.sets.filter(st=>st.reps!=null).length;
      setsByMuscle[ex.muscle]=(setsByMuscle[ex.muscle]||0)+done;
    }));
    const upper=["Brust","Rücken","Schultern","Trizeps","Bizeps","hintere Schulter"];
    const volRows=Object.keys(setsByMuscle).sort((a,b)=>setsByMuscle[b]-setsByMuscle[a]).map(m=>{
      const n=setsByMuscle[m], isUp=upper.includes(m);
      const target=isUp?20:10, pct=Math.min(100,n/target*100);
      const band=isUp?`<div class="band" style="left:${12/20*100}%; right:0;"></div>`:"";
      const col=isUp?(n<10?"var(--amber)":n<=20?"var(--green)":"var(--red)"):"var(--run)";
      return `<div class="vol"><div class="vt"><span>${esc(m)}</span><span class="mono">${n} Sätze${isUp?" · Ziel 12–20":""}</span></div>
        <div class="bar">${band}<div class="fill" style="width:${pct}%; background:${col}"></div></div></div>`;
    }).join("") || `<div class="empty">Keine Sätze in dieser Woche.</div>`;
    const checks=Object.keys(state.checkins||{}).filter(d=>inWeek(d,r)).sort().reverse();
    const checkRows = checks.length? checks.map(d=>{const ci=state.checkins[d];
      const dd=new Date(d+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
      const rd=ci.readiness?`<span class="zdot" style="background:${ZCOL[ci.readiness]}"></span>${ZLAB[ci.readiness]}`:"—";
      return `<div class="row">
        <div><div class="l">${dd}</div><div class="s">${ci.note?esc(ci.note):"&nbsp;"}</div></div>
        <div style="text-align:right"><div class="v" style="font-size:13px">${rd}</div><div class="s">${ci.feel?("Befinden: "+FLAB[ci.feel]):""}</div></div>
      </div>`;}).join("") : `<div class="empty">Keine Tages-Checks in dieser Woche.</div>`;
    const sesRows = ses.length? ses.slice().sort((a,b)=>a.date<b.date?1:-1).map(s=>{
      const pl=state.plans.find(p=>p.id===s.planId);
      const nS=(s.entries||[]).reduce((n,e)=>n+e.sets.length,0);
      const dd=new Date(s.date+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
      const rd=s.readiness?`<span class="zdot" style="background:${ZCOL[s.readiness]}"></span>`:"";
      return `<div class="row"><div><div class="l">${dd}</div><div class="s">${rd}${pl?esc(pl.name):"Einheit"} · ${nS} Sätze${s.prs&&s.prs.length?` · <span class="prtag">🏆 ${s.prs.length} PR</span>`:""}</div></div><div class="rowbtns"><button class="mini" data-editses="${s.id}">✏️</button><button class="del" data-delses="${s.id}">✕</button></div></div>`;
    }).join("") : `<div class="empty">Keine Krafteinheiten diese Woche.</div>`;
    return `
      <div class="wk-nav">
        <button data-wk="-1">‹</button>
        <span class="lab">${fmtD(r.mon)} – ${fmtD(r.sun)}${off===0?" · diese Woche":""}</span>
        <button data-wk="1" ${off>=0?"disabled style=opacity:.4":""}>›</button>
      </div>
      <div class="stat">
        <div class="box"><div class="num">${ses.length}</div><div class="lab">Kraft</div></div>
        <div class="box"><div class="num">${km.toFixed(1).replace(".",",")}</div><div class="lab">km</div></div>
        <div class="box"><div class="num">${(tonnage/1000).toFixed(1).replace(".",",")}t</div><div class="lab">Tonnage</div></div>
      </div>
      <div class="card"><h2>Sätze pro Muskel</h2>
        <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Oberkörper: Zielkorridor 12–20 (markiert). Beine bewusst niedrig — Laufen liefert die Frequenz.</div>
        ${volRows}</div>
      <div class="card"><h2>Einheiten</h2>${sesRows}</div>
      <div class="card"><h2>Befinden & Bereitschaft</h2>${checkRows}</div>`;
  }

  // ----- KÖRPERGEWICHT -----
  function viewGewicht(){
    const goal=state.weightGoal||80;
    const ws=(state.weights||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
    const latest=ws.length?ws[ws.length-1]:null, first=ws.length?ws[0]:null;
    const today=todayStr(); const existsToday=ws.find(x=>x.date===today);
    if(!state.ui.tf)state.ui.tf="monat";
    const wd=WINDOW[state.ui.tf], cutoff=Date.now()-wd*864e5;
    const pts=ws.filter(x=>dms(x.date)>=cutoff).map(x=>({t:dms(x.date),y:x.kg}));
    const series=[{name:"Körpergewicht",color:"#6366F1",fmt:v=>v.toFixed(1).replace(".",",")+" kg",invert:false,points:pts}];
    if(pts.length>=2) series.push({name:"Ziel "+goal+" kg",color:"#22C55E",fmt:v=>v+" kg",invert:false,points:[{t:pts[0].t,y:goal},{t:pts[pts.length-1].t,y:goal}]});
    const chart = pts.length? axChart(series, wd) : `<div class="empty">Noch keine Wiegedaten im Zeitraum.</div>`;
    const diff = latest? (goal-latest.kg) : null;
    const trend = (latest&&first&&latest.date!==first.date)? (latest.kg-first.kg) : null;
    const tfSeg=`<div class="seg sm">${["woche","monat","jahr"].map(t=>`<button data-tf="${t}" class="${state.ui.tf===t?"on":""}">${t==="woche"?"Woche":t==="monat"?"Monat":"Jahr"}</button>`).join("")}</div>`;
    const list = ws.slice().reverse().slice(0,10).map(x=>{
      const dd=new Date(x.date+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
      return `<div class="row"><div class="l">${dd}</div><div class="rowbtns"><span class="v mono">${x.kg.toFixed(1).replace(".",",")} kg</span><button class="del" data-delwt="${x.date}">✕</button></div></div>`;
    }).join("")||`<div class="empty">Noch nichts eingetragen.</div>`;
    return `<div class="card">
        <h2>Körpergewicht</h2>
        <div class="wt-entry">
          <input type="date" id="wtDate" class="dateinp" value="${today}" max="${today}">
          <input id="wtKg" class="mono" inputmode="decimal" placeholder="kg" value="${existsToday?existsToday.kg:""}">
          <button class="mini" id="wtAdd">${existsToday?"Ändern":"Eintragen"}</button>
        </div>
        ${latest?`<div class="wt-stat">
          <div class="box"><div class="num">${latest.kg.toFixed(1).replace(".",",")}</div><div class="lab">aktuell</div></div>
          <div class="box"><div class="num">${goal}</div><div class="lab">Ziel</div></div>
          <div class="box"><div class="num">${diff>=0?"+":""}${diff.toFixed(1).replace(".",",")}</div><div class="lab">bis Ziel</div></div>
        </div>`:`<div class="s" style="color:var(--muted);margin-top:8px">Trag dein Gewicht ein, um deinen Trend Richtung ${goal} kg zu sehen.</div>`}
        <div class="wt-goalrow">Ziel: <input id="wtGoal" class="mono" inputmode="decimal" value="${goal}"> kg</div>
      </div>
      <div class="card">${tfSeg}${chart}${trend!=null?`<div class="chartnote">Veränderung im Zeitraum: ${trend>=0?"+":""}${trend.toFixed(1).replace(".",",")} kg. Gesunder Aufbau: ca. +0,25–0,5 kg/Woche.</div>`:""}</div>
      <div class="card"><h2>Letzte Einträge</h2>${list}</div>`;
  }

  // Assistent: Modell-Empfehlung
  function recommendModel(a){
    if(a.plan==="easy") return "dp";
    if(a.exp==="anf") return a.goal==="kraft"?"linear":"dp";
    if(a.plan==="voll") return "meso";
    return a.goal==="kraft"?"linear":"dup";
  }
  function modelQuizModal(){
    const ov=document.createElement("div"); ov.className="overlay";
    const ans={};
    const Q=[
      {k:"exp",q:"Wie viel Trainingserfahrung?",o:[["anf","Anfänger / Wiedereinstieg"],["fort","Fortgeschritten"]]},
      {k:"goal",q:"Dein Hauptziel?",o:[["hyp","Muskelaufbau"],["kraft","Maximalkraft"],["allround","Allround-Fitness"]]},
      {k:"plan",q:"Wie viel Planung willst du?",o:[["easy","Einfach loslegen"],["struktur","Etwas Struktur"],["voll","Voll durchgeplant"]]},
    ];
    const draw=()=>{
      const done=Q.every(x=>ans[x.k]);
      const body=Q.map(x=>`<div class="qblock"><div class="qq">${x.q}</div>
        <div class="qopts">${x.o.map(([v,l])=>`<button class="qopt ${ans[x.k]===v?"on":""}" data-q="${x.k}" data-v="${v}">${l}</button>`).join("")}</div></div>`).join("");
      let rec="";
      if(done){ const m=recommendModel(ans); const M=MODELS[m];
        rec=`<div class="qrec"><div class="s" style="color:var(--muted)">Empfehlung</div><div class="qrecname">${M.name}</div><div class="godesc">${M.short}</div>
          <button class="mbtn ok" data-apply="${m}" style="margin-top:12px">Übernehmen &amp; aktivieren</button></div>`; }
      ov.querySelector(".modal").innerHTML=`<div class="mmsg"><b>Welches Modell passt?</b></div>
        <div class="s" style="color:var(--muted);margin:2px 0 12px">Drei kurze Fragen — du kannst danach trotzdem frei wählen.</div>
        ${body}${rec}
        <div class="mbtns" style="margin-top:14px"><button class="mbtn cancel" data-close="1">Schließen</button></div>`;
      ov.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ans[b.dataset.q]=b.dataset.v; draw();});
      const ap=ov.querySelector("[data-apply]"); if(ap) ap.onclick=()=>{ const m=ap.dataset.apply;
        state.cycle=state.cycle||{}; state.cycle.model=m; state.cycle.on=true;
        if(!state.cycle.start)state.cycle.start=mondayStr(todayStr());
        if(!state.cycle.build)state.cycle.build=3; if(!state.cycle.deload)state.cycle.deload=1;
        ov.remove(); save(); toast(MODELS[m].name+" aktiviert ✓"); render(); };
      ov.querySelector("[data-close]").onclick=()=>ov.remove();
    };
    ov.innerHTML=`<div class="modal modalq"></div>`;
    document.body.appendChild(ov);
    ov.onclick=e=>{if(e.target===ov)ov.remove();};
    draw();
  }

  function goalCard(){
    const g=state.goal, sel=g?GOALS[g]:null;
    const opts=Object.keys(GOALS).map(k=>{const G=GOALS[k];
      return `<div class="goalopt ${g===k?"on":""}" data-goal="${k}">
        <div class="got"><span class="goname">${G.name}</span><span class="gorange mono">${G.repMin}–${G.repMax} Wdh</span></div>
        <div class="godesc">${G.short}</div>
        <details class="add"><summary>Mehr &amp; wissenschaftlich</summary>
          <div class="goadv">${G.adv}<div class="gosci">📚 ${esc(G.sci)}</div></div></details>
      </div>`;}).join("");
    const zones = sel?`<div class="zonegrid">
        ${zrow("Wiederholungen",sel.repMin+"–"+sel.repMax)}
        ${zrow("Intensität",sel.pct+" 1RM")}
        ${zrow("RIR (Reserve)",sel.rir)}
        ${zrow("Satzpause",sel.rest)}
        ${zrow("Wochenvolumen",sel.vol)}
      </div>
      <button class="save" id="applyGoal" style="margin:12px 0 0">Wdh.-Bereiche aller Übungen auf „${esc(sel.name)}" setzen</button>
      <div class="cinote">Check-in: <select id="ciInt">
        <option value="3" ${state.checkin&&state.checkin.intervalMonths===3?"selected":""}>alle 3 Monate nachfragen</option>
        <option value="6" ${state.checkin&&state.checkin.intervalMonths===6?"selected":""}>alle 6 Monate nachfragen</option>
        </select>${state.checkin&&state.checkin.nextDate?` · nächster am ${fmtDateDE(state.checkin.nextDate)}`:""}</div>`:"";
    return `<div class="card"><h2>Trainingsziel &amp; Check-in</h2>
      <div class="sub">Wähle dein Ziel — die App stellt Wiederholungen &amp; Last passend ein und erinnert dich nach 3–6 Monaten, es zu überprüfen.</div>
      ${opts}${zones}</div>`;
  }
  function zrow(l,v){return `<div class="zr2"><span class="zl2">${l}</span><span class="zv2 mono">${esc(v)}</span></div>`;}

  function settingsCard(){
    const simple=state.ui.simple;
    return `<div class="card"><h2>Einstellungen</h2>
      <label class="bwrow"><input type="checkbox" id="simpleToggle" ${simple?"checked":""}> <span>Einfacher Modus</span></label>
      <div class="s" style="color:var(--muted);margin:4px 0 0">Blendet RPE, den Garmin-Tages-Check, die Periodisierung und Detail-Hinweise aus — ideal zum Loslegen. Jederzeit umschaltbar.</div>
      <div class="field" style="margin-top:14px"><label>Standard-Pausenzeit zwischen Sätzen (Sekunden)</label><input id="restDefault" class="mono" inputmode="numeric" value="${state.ui.restDefault||120}"></div>
    </div>`;
  }
  function suggestCard(){
    const f=state.ui.sugFreq||3;
    const T=TEMPLATES[String(f)]||TEMPLATES["3"];
    const vi=Math.min(state.ui.sugVar||0,T.length-1);
    const t=T[vi];
    const freqSeg=`<div class="seg sm">${[2,3,4,5,6].map(n=>`<button data-sugfreq="${n}" class="${f===n?"on":""}">${n}×</button>`).join("")}</div>`;
    const varSeg=T.length>1?`<div class="seg sm" style="margin-top:8px">${T.map((x,i)=>`<button data-sugvar="${i}" class="${vi===i?"on":""}">${esc(x.v)}</button>`).join("")}</div>`:`<div class="s" style="color:var(--muted);margin:8px 0 0">${esc(t.v)}</div>`;
    const prev=t.d.map(day=>{
      const lines=day[1].map(sl=>{ const P=PATTERNS[sl[0]]||PATTERNS.other;
        const exId=findByPat(sl[0],sl[4]||null); const db=dbDefaultFor(sl[0],sl[4]||null);
        const exName=exId?state.exercises[exId].name:(db?db.n:P.n);
        return `<div class="tslot"><span>${esc(P.n)}</span><span class="tsr mono">${sl[1]}×${sl[2]}–${sl[3]}</span><span class="tse">${esc(exName)}</span></div>`; }).join("");
      return `<div class="tday"><div class="tdn">${esc(day[0])}</div>${lines}</div>`; }).join("");
    return `<div class="card hl"><h2>🧩 Plan-Vorschlag</h2>
      <div class="s" style="color:var(--muted);margin-bottom:10px">Wähle deine Trainingstage pro Woche — du bekommst einen wissenschaftlich soliden Vorschlag nach Bewegungsmustern (Basis: shiftingfitness-Pläne). Übernehmen oder verwerfen und unten selbst bauen. Jede Übung lässt sich danach frei tauschen.</div>
      ${freqSeg}${varSeg}
      <details class="add" style="margin-top:10px" open><summary>Vorschau</summary><div style="margin-top:8px">${prev}</div></details>
      <button class="save" id="sugApply" style="margin:12px 0 0">Diesen Plan übernehmen</button>
    </div>`;
  }
  function sugApplyModal(){
    const ov=document.createElement("div"); ov.className="overlay";
    ov.innerHTML=`<div class="modal"><div class="mmsg" style="color:#fff"><b>Plan übernehmen</b></div>
      <div class="s" style="color:#C3CBD3;line-height:1.5">Sollen deine bisherigen Trainingstage ersetzt werden, oder kommen die neuen Tage zusätzlich dazu? Dein Trainings-Verlauf bleibt in beiden Fällen vollständig erhalten.</div>
      <div class="mbtns" style="margin-top:16px;flex-direction:column">
        <button class="mbtn ok" data-m="replace">Ersetzen</button>
        <button class="mbtn cancel" data-m="add">Zusätzlich anlegen</button>
        <button class="mbtn cancel" data-m="x">Abbrechen</button>
      </div></div>`;
    document.body.appendChild(ov);
    ov.onclick=e=>{ const b=e.target.closest("[data-m]"); if(e.target===ov){ov.remove();return;} if(!b)return;
      const m=b.dataset.m; ov.remove(); if(m==="x")return;
      applyTemplate(state.ui.sugFreq||3, state.ui.sugVar||0, m==="replace"); };
  }
  function viewPlan(){
    const simple=state.ui.simple;
    const exAll=Object.keys(state.exercises).map(id=>state.exercises[id]);
    const byName=(a,b)=>a.name.localeCompare(b.name,"de");
    const plansHtml=state.plans.map(p=>{
      const members=p.exerciseIds.filter(id=>state.exercises[id]);
      const chips = members.length? members.map(id=>`<span class="chip on" data-rmplan="${p.id}|${id}">${esc(state.exercises[id].name)} ✕</span>`).join("")
        : `<div class="s" style="color:var(--muted)">Noch keine Übungen — unten unter „Übungen zuordnen" hinzufügen.</div>`;
      return `<div class="card"><h2 style="display:flex;justify-content:space-between;align-items:center">${esc(p.name)}
          <button class="del" data-delplan="${p.id}">✕</button></h2>
        ${chips}
      </div>`;
    }).join("");

    const assignCard=`<div class="card"><h2>Übungen zuordnen</h2>
      <div class="s" style="color:var(--muted);margin-bottom:10px">Grau = noch keinem Tag zugeordnet · Blau = bereits in einem Tag. Tippe eine Übung an und wähle im Pop-up die Trainingstage.</div>
      <div class="chipwrap">${exAll.slice().sort(byName).map(e=>{const assigned=state.plans.some(p=>p.exerciseIds.includes(e.id));
        return `<span class="chip ${assigned?"on":""}" data-assignex="${e.id}">${esc(e.name)}</span>`;}).join("")}</div></div>`;

    const newPlan=`<div class="card hl"><h2>➕ Neuen Trainingstag anlegen</h2>
      <div class="s" style="color:var(--muted);margin-bottom:8px">Erstelle einen neuen Trainingstag/Split (z.B. „So · Core & Mobility"). Übungen ordnest du danach unten zu.</div>
      <div class="field" style="margin-bottom:8px"><input id="npName" placeholder="z.B. So · Core & Mobility"></div>
      <button class="save" id="addPlan" style="margin-bottom:0">Trainingstag anlegen</button></div>`;

    const existingNames=new Set(exAll.map(e=>e.name.toLowerCase().trim()));
    const dbGroups={}; EXDB.forEach((e,i)=>{ const P=PATTERNS[e.p]; ((dbGroups[P.reg]=dbGroups[P.reg]||{})[P.n]=(dbGroups[P.reg][P.n]||[])).push([e,i]); });
    const dbInner=REGORDER.filter(r=>dbGroups[r]).map(reg=>{
      const pats=dbGroups[reg];
      const inner=Object.keys(pats).map(pn=>`<div class="patlbl">${esc(pn)}</div><div class="chips">`+pats[pn].map(([e,i])=>{
        const inLib=existingNames.has(e.n.toLowerCase());
        return inLib?`<span class="chip on">✓ ${esc(e.n)}</span>`:`<span class="chip" data-adddb="${i}">+ ${esc(e.n)} <em>${esc(e.eq)}</em></span>`;
      }).join("")+`</div>`).join("");
      const cnt=Object.values(pats).reduce((a,b)=>a+b.length,0);
      return `<details class="add grp" data-dkey="db:${esc(reg)}"><summary>${esc(reg)} <span class="grpn">(${cnt})</span></summary><div style="margin-top:4px">${inner}</div></details>`;
    }).join("");
    const classicsCard=`<div class="card"><h2>Übungs-Datenbank</h2>
      <div class="s" style="color:var(--muted);margin-bottom:10px">${EXDB.length} Übungen — nach Muskelregion & Bewegungsrichtung sortiert, frei & an Geräten. Antippen fügt sie deiner Bibliothek hinzu (✓ = schon vorhanden). Danach oben einem Trainingstag zuordnen.</div>${dbInner}</div>`;

    const newEx=`<div class="card"><h2>Neue Übung</h2>
        <details class="add"><summary>+ Übung anlegen</summary>
          <div style="margin-top:12px">
          <div class="field"><label>Name</label><input id="nName" placeholder="z.B. Plank / Beinbeuger"></div>
          <div class="grid2">
            <div class="field"><label>Muskel</label><input id="nMuscle" placeholder="z.B. Core"></div>
            <div class="field"><label>Zu Plan</label><select id="nPlan">${state.plans.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div>
          </div>
          <div class="grid2">
            <div class="field"><label>Sätze</label><input id="nSets" class="mono" inputmode="numeric" value="3"></div>
            <div class="field"><label>Steigerung (kg)</label><input id="nInc" class="mono" inputmode="decimal" value="2.5"></div>
          </div>
          <div class="grid2">
            <div class="field"><label>Wdh. min</label><input id="nLo" class="mono" inputmode="numeric" value="8"></div>
            <div class="field"><label>Wdh. max</label><input id="nHi" class="mono" inputmode="numeric" value="10"></div>
          </div>
          <label class="bwrow" style="margin-bottom:10px"><input type="checkbox" id="nBw"> Eigengewicht (z.B. Mobility/Core)</label>
          <div class="field"><label>Faktor</label><select id="nMode"><option value="reps">Wiederholungen</option><option value="time">Zeit (z.B. Farmer's Carry, Plank)</option></select></div>
          <button class="save" id="addEx" style="margin-bottom:4px">Übung hinzufügen</button>
          </div>
        </details>
      </div>`;

    const libItem=e=>{const tm=e.mode==="time";return `
      <div class="libx">
        <div class="libtop"><input class="libname" data-ef="name" data-id="${e.id}" value="${esc(e.name)}"><button class="del" data-delex="${e.id}">✕</button></div>
        <div class="libgrid">
          <label>Sätze<input class="mono" data-ef="sets" data-id="${e.id}" value="${e.sets}" inputmode="numeric"></label>
          <label>${tm?"Zeit min (s)":"Wdh min"}<input class="mono" data-ef="repMin" data-id="${e.id}" value="${e.repMin}" inputmode="numeric"></label>
          <label>${tm?"Zeit max (s)":"Wdh max"}<input class="mono" data-ef="repMax" data-id="${e.id}" value="${e.repMax}" inputmode="numeric"></label>
          <label>+ kg<input class="mono" data-ef="increment" data-id="${e.id}" value="${e.increment}" inputmode="decimal"></label>
        </div>
        <div class="librow2">
          <label class="bwrow"><input type="checkbox" data-ef="bodyweight" data-id="${e.id}" ${e.bodyweight?"checked":""}> Eigengewicht</label>
          <label class="faktor">Faktor:
            <select data-ef="mode" data-id="${e.id}"><option value="reps" ${!tm?"selected":""}>Wiederholungen</option><option value="time" ${tm?"selected":""}>Zeit</option></select>
          </label>
        </div>
      </div>`;};
    const groups={}; exAll.forEach(e=>{ const P=PATTERNS[e.pat||guessPat(e.name)]||PATTERNS.other;
      ((groups[P.reg]=groups[P.reg]||{})[P.n]=(groups[P.reg][P.n]||[])).push(e); });
    const libGroups=REGORDER.filter(r=>groups[r]).map(reg=>{
      const pats=groups[reg];
      const inner=Object.keys(pats).map(pn=>`<div class="patlbl">${esc(pn)}</div>`+pats[pn].slice().sort(byName).map(libItem).join("")).join("");
      const cnt=Object.values(pats).reduce((a,b)=>a+b.length,0);
      return `<details class="add grp" data-dkey="edit:${esc(reg)}"><summary>${esc(reg)} <span class="grpn">(${cnt})</span></summary><div style="margin-top:4px">${inner}</div></details>`;}).join("");
    const libCard=`<div class="card"><h2>Übungen bearbeiten</h2>
      <div class="s" style="color:var(--muted);margin-bottom:8px">Nach Muskelregion & Bewegungsrichtung gruppiert — antippen zum Aufklappen. Faktor „Zeit" z.B. für Farmer's Carries oder Planks; Schritt frei wählbar (Keiser z.B. 0,1).</div>${libGroups}</div>`;

    const dataCard=`<div class="card"><h2>Daten & Sicherung</h2>
      <div class="rec-note" style="margin-top:0;margin-bottom:10px">${PERSIST
        ? "Alles wird automatisch & dauerhaft auf diesem Gerät gespeichert und bleibt nach Neustart erhalten. Den Verlauf siehst du im Tab Verlauf. Tipp: ab und zu ein Backup sichern — dann ist nichts verloren, falls du das Gerät wechselst."
        : "Hinweis: Persistenter Speicher hier nicht aktiv — sichere deine Daten per Export."}</div>
      <div class="setbtns" style="margin-bottom:0"><button class="mini" id="downloadData">⬇️ Als Datei sichern</button><button class="mini" id="exportData">Backup kopieren (JSON)</button></div>
      <details class="add" style="margin-top:12px"><summary>Backup einspielen</summary>
        <div style="margin-top:8px">
          <textarea id="impText" class="imp" placeholder="JSON hier einfügen…"></textarea>
          <button class="mini" id="importData" style="margin-top:6px">Daten importieren (überschreibt)</button>
        </div>
      </details>
    </div>`;

    return suggestCard()+settingsCard()+goalCard()+(simple?"":cycleCard())+newPlan+plansHtml+assignCard+classicsCard+newEx+libCard+dataCard;
  }

  // ---------- events ----------
  function bind(){
    document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.ui.tab=b.dataset.tab; save(); render();});

    // Pausentimer
    const rb=document.getElementById("restbar"); if(rb) rb.onclick=(e)=>{const b=e.target.closest("[data-rest]"); if(!b)return; const v=b.dataset.rest;
      if(v==="-15")addRest(-15); else if(v==="+15")addRest(15); else if(v==="stop")stopRest(); else if(v==="restart")startRest(rest.total||state.ui.restDefault||120);};
    document.querySelectorAll("[data-reststart]").forEach(b=>b.onclick=()=>{const ex=state.exercises[b.dataset.reststart]; startRest((ex&&ex.rest)||state.ui.restDefault||120);});
    document.querySelectorAll("[data-exrm]").forEach(b=>b.onclick=()=>{ const id=b.dataset.exrm; const ld=logDate();
      if(state.ui.extra&&state.ui.extra.includes(id)){ state.ui.extra=state.ui.extra.filter(x=>x!==id); if(draft&&draft[id])delete draft[id]; skipCapture=true; save(); render(); toast("Zusatz-Übung entfernt"); return; }
      if(!state.ui.skip||state.ui.skip.date!==ld) state.ui.skip={date:ld,ids:[]};
      if(!state.ui.skip.ids.includes(id)) state.ui.skip.ids.push(id);
      if(draft&&draft[id])delete draft[id]; skipCapture=true; save(); render(); toast("Heute rausgenommen — nächstes Mal wieder dabei"); });
    document.querySelectorAll("[data-unskip]").forEach(b=>b.onclick=()=>{ state.ui.skip=null; skipCapture=true; save(); render(); });
    // Tooltips
    document.querySelectorAll("[data-info]").forEach(b=>b.onclick=(e)=>{e.preventDefault(); showTip(b.dataset.info);});
    // Einstellungen
    const st=$("simpleToggle"); if(st) st.onchange=()=>{ state.ui.simple=st.checked; save(); render(); };
    const rd=$("restDefault"); if(rd) rd.onchange=()=>{ const v=parseInt(rd.value); if(v>=10&&v<=600)state.ui.restDefault=v; save(); };
    // Körpergewicht
    const wa=$("wtAdd"); if(wa) wa.onclick=()=>{ const d=($("wtDate").value||todayStr()); const kg=parseFloat(($("wtKg").value||"").replace(",",".")); if(!(kg>0)){toast("Gewicht eingeben");return;}
      state.weights=(state.weights||[]).filter(x=>x.date!==d); state.weights.push({date:d,kg:Math.round(kg*10)/10}); save(); toast("Gewicht gespeichert ✓"); render(); };
    const wg=$("wtGoal"); if(wg) wg.onchange=()=>{ const v=parseFloat((wg.value||"").replace(",",".")); if(v>0)state.weightGoal=Math.round(v*10)/10; save(); render(); };
    document.querySelectorAll("[data-delwt]").forEach(b=>b.onclick=()=>{ const d=b.dataset.delwt; confirmBox("Diesen Wiege-Eintrag löschen?",()=>{ state.weights=(state.weights||[]).filter(x=>x.date!==d); save(); render(); }); });
    // Einheit bearbeiten
    document.querySelectorAll("[data-editses]").forEach(b=>b.onclick=()=>{ const s=state.sessions.find(x=>x.id===b.dataset.editses); if(!s)return;
      state.ui.logDate=s.date; if(s.planId)state.ui.planId=s.planId; state.ui.tab="heute"; clearDraft(); save(); render(); toast("Einheit zum Bearbeiten geladen"); });
    // Download-Backup
    const dl=$("downloadData"); if(dl) dl.onclick=()=>{ try{ const blob=new Blob([JSON.stringify(state)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="trainingslog-backup-"+todayStr()+".json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast("Backup-Datei erstellt ✓"); }catch(e){ toast("Download nicht möglich — nutze Backup kopieren."); } };

    // <details> offen halten über Re-Renders (z.B. beim Faktor-Wechsel)
    state.ui.open=state.ui.open||{};
    document.querySelectorAll("details[data-dkey]").forEach(dt=>{
      if(state.ui.open[dt.dataset.dkey]) dt.open=true;
      dt.addEventListener("toggle",()=>{ state.ui.open[dt.dataset.dkey]=dt.open; save(); });
    });

    // trainingstag-datum (Nachtragen)
    const ldI=$("logDate"); if(ldI) ldI.onchange=()=>{ state.ui.logDate=ldI.value||todayStr(); clearDraft(); render(); };
    // tages-check: Trainingsbereitschaft
    document.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{
      const t=logDate(); const c=state.checkins[t]||(state.checkins[t]={});
      c.readiness = c.readiness===b.dataset.rd ? null : b.dataset.rd; save(); render();});
    // tages-check: Befinden
    document.querySelectorAll("[data-feel]").forEach(b=>b.onclick=()=>{
      const t=logDate(); const c=state.checkins[t]||(state.checkins[t]={});
      const v=+b.dataset.feel; c.feel = c.feel===v ? null : v; save(); render();});
    // tages-check: Notiz (kein Re-Render -> Fokus bleibt)
    const cn=$("checkNote"); if(cn) cn.oninput=()=>{ const t=logDate(); const c=state.checkins[t]||(state.checkins[t]={}); c.note=cn.value; save(); };
    const sc=$("saveCheck"); if(sc) sc.onclick=()=>{ const t=logDate(); const c=state.checkins[t]||(state.checkins[t]={});
      if(!c.readiness&&!c.feel&&!(c.note&&c.note.trim())){toast("Erst Bereitschaft oder Befinden wählen");return;}
      c.saved=true; c.savedAt=new Date().toISOString(); if(state.ui.checkinOpen===t)state.ui.checkinOpen=null; save(); toast("Tages-Check gespeichert ✓"); render(); };
    document.querySelectorAll("[data-ciopen]").forEach(b=>b.onclick=()=>{ state.ui.checkinOpen=b.dataset.ciopen; state.ui.checkinDismiss=null; render(); });
    document.querySelectorAll("[data-cidismiss]").forEach(b=>b.onclick=()=>{ state.ui.checkinDismiss=b.dataset.cidismiss; render(); });
    // plan switch
    document.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>{state.ui.planId=b.dataset.plan; save(); render();});
    document.querySelectorAll("[data-gotoplan]").forEach(b=>b.onclick=()=>{state.ui.tab="plan"; save(); render();});
    // Übung nur für heute
    document.querySelectorAll("[data-extra]").forEach(c=>c.onclick=()=>{const id=c.dataset.extra; state.ui.extra=state.ui.extra||[];
      const i=state.ui.extra.indexOf(id); if(i>=0)state.ui.extra.splice(i,1); else state.ui.extra.push(id); save(); render();});
    // sets +/-
    document.querySelectorAll("[data-setplus]").forEach(b=>b.onclick=()=>{const id=b.dataset.setplus; captureDraft(); state.exercises[id].sets++; skipCapture=true; save(); render();});
    document.querySelectorAll("[data-setminus]").forEach(b=>b.onclick=()=>{const id=b.dataset.setminus; if(state.exercises[id].sets>1){captureDraft(); state.exercises[id].sets--; skipCapture=true; save(); render();}});

    const ss=$("saveSession"); if(ss) ss.onclick=saveSession;
    // RIR <-> RPE live-Verknüpfung (RPE = 10 - RIR), ohne Re-Render
    document.querySelectorAll(".card.ex table.sets tbody tr").forEach(tr=>{
      const rir=tr.querySelector('[data-f="rir"]'), rpe=tr.querySelector('[data-f="rpe"]');
      if(rir&&rpe){
        rir.oninput=()=>{ const v=rir.value.trim(); rpe.value = v===""?"":(10-parseFloat(v.replace(",","."))); };
        rpe.oninput=()=>{ const v=rpe.value.trim(); rir.value = v===""?"":(10-parseFloat(v.replace(",","."))); };
      }
    });
    // Fix: Klick auf "Mehr & wissenschaftlich" nicht zur Zielauswahl durchreichen
    document.querySelectorAll(".goalopt details").forEach(dt=>dt.onclick=e=>e.stopPropagation());

    const rspt=$("rSport"); if(rspt) rspt.onchange=()=>{state.ui.sport=rspt.value; render();};
    const sr=$("saveRun"); if(sr) sr.onclick=()=>{
      const sp=state.ui.sport||"lauf", S=SPORTS[sp];
      const gv=id=>{const el=$(id);return el?el.value.trim():"";};
      const numF=id=>{const v=gv(id);return v===""?null:parseFloat(v.replace(",","."));};
      const intF=id=>{const v=gv(id);return v===""?null:parseInt(v);};
      const dur=parseDuration(gv("fDur"));
      if(!dur){toast("Dauer eingeben (z.B. 32:15)");return;}
      const a={id:uid(),date:($("rDate")&&$("rDate").value)||todayStr(),sport:sp,durationSec:dur,
        hr:intF("fHr"),hrMax:intF("fHrMax"),zone:$("rZone")?$("rZone").value:"",note:gv("rNote")};
      if(S.fields.includes("km")) a.km=numF("fKm");
      if(S.fields.includes("meters")) a.meters=intF("fM");
      if(S.fields.includes("speed")) a.speed=numF("fSpeed");
      if(S.fields.includes("incline")) a.incline=numF("fInc");
      if(S.fields.includes("steps")) a.steps=intF("fSteps");
      if(S.fields.includes("rpm")) a.rpm=intF("fRpm");
      if(S.fields.includes("watts")) a.watts=intF("fW");
      if(S.fields.includes("resistance")) a.resistance=gv("fRes")||null;
      if(S.fields.includes("laps")) a.laps=intF("fLaps");
      // Distanzpflicht für distanzbasierte Sportarten (außer indoor)
      if((sp==="lauf"||sp==="laufband"||sp==="gehen"||sp==="rad")&&!a.km){toast("Distanz (km) eingeben");return;}
      if(sp==="schwimmen"&&!a.meters){toast("Distanz (m) eingeben");return;}
      state.runs.push(a); save(); toast(S.name+" gespeichert ✓"); render();
    };
    document.querySelectorAll("[data-delrun]").forEach(b=>b.onclick=()=>{state.runs=state.runs.filter(r=>r.id!==b.dataset.delrun); save(); render();});
    document.querySelectorAll("[data-delses]").forEach(b=>b.onclick=()=>{ confirmBox("Diese Einheit löschen?",()=>{
      state.sessions=state.sessions.filter(s=>s.id!==b.dataset.delses); save(); render();});});

    const hs=$("histSel"); if(hs) hs.onchange=()=>{state.ui.histEx=hs.value; save(); render();};
    document.querySelectorAll("[data-hmode]").forEach(b=>b.onclick=()=>{state.ui.histMode=b.dataset.hmode; save(); render();});
    document.querySelectorAll("[data-tf]").forEach(b=>b.onclick=()=>{state.ui.tf=b.dataset.tf; save(); render();});
    const toggleMetric=(arr,key)=>{const i=arr.indexOf(key); if(i>=0){if(arr.length>1)arr.splice(i,1);}else arr.push(key);};
    document.querySelectorAll("[data-kmetric]").forEach(b=>b.onclick=()=>{state.ui.kMetrics=state.ui.kMetrics||["e1rm"]; toggleMetric(state.ui.kMetrics,b.dataset.kmetric); save(); render();});
    const cSp=$("cSportSel"); if(cSp) cSp.onchange=()=>{state.ui.cSport=cSp.value; save(); render();};
    document.querySelectorAll("[data-rmetric]").forEach(b=>b.onclick=()=>{
      const sp=state.ui.cSport||"lauf"; state.ui.cMetrics=state.ui.cMetrics||{};
      if(!state.ui.cMetrics[sp])state.ui.cMetrics[sp]=(SPORT_DEFAULT_METRICS[sp]||["dur"]).slice();
      toggleMetric(state.ui.cMetrics[sp],b.dataset.rmetric); save(); render();});
    const rw=$("rmW"); if(rw) rw.onchange=()=>{state.ui.rmW=parseFloat((rw.value||"").replace(",","."))||0; save(); render();};
    const rr=$("rmR"); if(rr) rr.onchange=()=>{state.ui.rmR=Math.max(1,Math.min(12,parseInt(rr.value)||1)); save(); render();};

    document.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{const d=+b.dataset.wk; if(state.ui.weekOffset+d<=0){state.ui.weekOffset+=d; render();}});

    // Periodisierung
    document.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>{ state.cycle=state.cycle||{build:3,deload:1};
      state.cycle.model=b.dataset.model; state.cycle.on=true;
      if(!state.cycle.start)state.cycle.start=mondayStr(todayStr());
      if(!state.cycle.build)state.cycle.build=3; if(!state.cycle.deload)state.cycle.deload=1; save(); render(); });
    const mq=$("modelQuiz"); if(mq) mq.onclick=()=>modelQuizModal();
    const cyOn=$("cyOn"); if(cyOn) cyOn.onchange=()=>{ state.cycle=state.cycle||{build:3,deload:1};
      state.cycle.on=cyOn.checked; if(!state.cycle.model)state.cycle.model="dp";
      if(state.cycle.on&&!state.cycle.start)state.cycle.start=mondayStr(todayStr());
      if(!state.cycle.build)state.cycle.build=3; if(!state.cycle.deload)state.cycle.deload=1; save(); render(); };
    const cySt=$("cyStart"); if(cySt) cySt.onchange=()=>{ state.cycle=state.cycle||{on:true,build:3,deload:1};
      state.cycle.start=mondayStr(cySt.value||todayStr()); save(); render(); };
    const cyB=$("cyBuild"); if(cyB) cyB.onchange=()=>{ state.cycle=state.cycle||{on:true,deload:1};
      const v=parseInt(cyB.value); if(v>=1&&v<=8)state.cycle.build=v; save(); render(); };

    // Trainingsziel & Check-in
    document.querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{
      state.goal=b.dataset.goal;
      if(!state.checkin) state.checkin={intervalMonths:3,lastDate:todayStr(),nextDate:addMonths(todayStr(),3)};
      save(); render();});
    const ag=$("applyGoal"); if(ag) ag.onclick=()=>{ const G=GOALS[state.goal]; if(!G)return;
      confirmBox(`Alle Übungen auf ${G.repMin}–${G.repMax} Wdh. (${G.name}) setzen?`,()=>{
        Object.keys(state.exercises).forEach(id=>{const ex=state.exercises[id]; if(!ex.bodyweight){ex.repMin=G.repMin; ex.repMax=G.repMax;}});
        save(); toast("Übungen aufs Ziel eingestellt ✓"); render();});};
    const ciI=$("ciInt"); if(ciI) ciI.onchange=()=>{ if(!state.checkin)state.checkin={lastDate:todayStr()};
      state.checkin.intervalMonths=parseInt(ciI.value)||3; state.checkin.nextDate=addMonths(state.checkin.lastDate||todayStr(),state.checkin.intervalMonths); save(); render();};
    document.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{
      if(b.dataset.ci==="keep"){ const m=(state.checkin&&state.checkin.intervalMonths)||3; state.checkin={intervalMonths:m,lastDate:todayStr(),nextDate:addMonths(todayStr(),m)}; save(); toast("Check-in verschoben ✓"); render(); }
      else { state.ui.tab="plan"; save(); render(); }});

    // plan membership
    document.querySelectorAll("[data-rmplan]").forEach(b=>b.onclick=()=>{const [pid,eid]=b.dataset.rmplan.split("|");
      const p=state.plans.find(x=>x.id===pid); if(p){p.exerciseIds=p.exerciseIds.filter(id=>id!==eid); save(); render();}});
    document.querySelectorAll("[data-assignex]").forEach(b=>b.onclick=()=>dayAssignModal(b.dataset.assignex));
    document.querySelectorAll("[data-delplan]").forEach(b=>b.onclick=()=>{const pid=b.dataset.delplan;
      const p=state.plans.find(x=>x.id===pid); if(!p)return;
      if(state.plans.length<=1){toast("Mindestens 1 Plan nötig");return;}
      confirmBox(`Plan „${p.name}" löschen? (Übungen & Verlauf bleiben erhalten)`,()=>{
        state.plans=state.plans.filter(x=>x.id!==pid);
        if(state.ui.planId===pid)state.ui.planId=state.plans[0].id;
        save(); render();});});

    const acl=$("addClassics"); if(acl) acl.onclick=()=>{
      const existing=new Set(Object.keys(state.exercises).map(id=>state.exercises[id].name.toLowerCase().trim()));
      let n=0;
      CLASSIC.forEach(c=>{ const key=c.n.toLowerCase().trim(); if(existing.has(key))return;
        const id=uid(); state.exercises[id]={id,name:c.n,muscle:c.m,sets:c.s||3,repMin:c.lo,repMax:c.hi,increment:c.inc,
          bodyweight:!!c.bw,mode:c.mode||"reps",lastWeight:null,active:true,type:"strength"};
        existing.add(key); n++; });
      save(); toast(n? n+" Übungen hinzugefügt ✓":"Alle bereits vorhanden"); render();
    };
    const ap=$("addPlan"); if(ap) ap.onclick=()=>{const name=($("npName").value||"").trim();
      if(!name){toast("Name fehlt");return;}
      const id=uid(); state.plans.push({id,name,exerciseIds:[]}); state.ui.planId=id; save(); toast("Trainingstag angelegt ✓"); render();};
    // Plan-Vorschläge
    document.querySelectorAll("[data-sugfreq]").forEach(b=>b.onclick=()=>{ state.ui.sugFreq=parseInt(b.dataset.sugfreq); state.ui.sugVar=0; save(); render(); });
    document.querySelectorAll("[data-sugvar]").forEach(b=>b.onclick=()=>{ state.ui.sugVar=parseInt(b.dataset.sugvar); save(); render(); });
    const sga=$("sugApply"); if(sga) sga.onclick=()=>sugApplyModal();
    // Übungs-Datenbank
    document.querySelectorAll("[data-adddb]").forEach(b=>b.onclick=()=>{ const e=EXDB[parseInt(b.dataset.adddb)]; if(!e)return; const P=PATTERNS[e.p];
      const id=uid(); state.exercises[id]={id,name:e.n,muscle:P.reg,pat:e.p,sets:3,repMin:e.lo||P.lo,repMax:e.hi||P.hi,increment:e.inc||P.inc,bodyweight:!!e.bw,mode:e.mode||"reps",lastWeight:null,active:true,type:"strength"};
      save(); render(); toast(e.n+" hinzugefügt ✓"); });

    // library inline edit (onchange -> kein Fokusverlust)
    document.querySelectorAll("[data-ef]").forEach(inp=>inp.onchange=()=>{
      const ex=state.exercises[inp.dataset.id]; if(!ex)return; const f=inp.dataset.ef;
      if(f==="name"){const v=inp.value.trim(); if(v){ex.name=v; save(); render();} else {inp.value=ex.name;} return;}
      if(f==="mode"){ex.mode=inp.value; save(); render(); return;}
      if(f==="bodyweight"){ex.bodyweight=inp.checked;}
      else if(f==="increment"){ex.increment=parseFloat((inp.value||"0").replace(",","."))||0;}
      else {const v=parseInt(inp.value); if(!isNaN(v)&&v>0)ex[f]=v;}
      save();});
    document.querySelectorAll("[data-delex]").forEach(b=>b.onclick=()=>{const id=b.dataset.delex;
      const ex=state.exercises[id]; if(!ex)return;
      confirmBox(`„${ex.name}" ganz löschen? Entfernt sie aus allen Plänen.`,()=>{
        delete state.exercises[id]; state.plans.forEach(p=>p.exerciseIds=p.exerciseIds.filter(x=>x!==id));
        save(); render();});});

    const im=$("importData"); if(im) im.onclick=()=>{
      let obj; try{ obj=JSON.parse($("impText").value); }catch(e){ toast("Ungültiges JSON"); return; }
      if(!obj||!obj.exercises||!obj.plans){ toast("Ungültiges JSON"); return; }
      confirmBox("Aktuelle Daten überschreiben?",()=>{
        state=obj; if(!state.checkins)state.checkins={}; if(!state.ui)state.ui={tab:"plan",planId:state.plans[0].id,weekOffset:0};
        save(); toast("Import erfolgreich ✓"); render();});
    };

    const ae=$("addEx"); if(ae) ae.onclick=()=>{
      const name=($("nName").value||"").trim(); if(!name){toast("Name fehlt");return;}
      const id=uid();
      const bw=$("nBw")&&$("nBw").checked;
      state.exercises[id]={id,name,muscle:($("nMuscle").value||"Sonstige").trim(),pat:guessPat(name),
        sets:Math.max(1,parseInt($("nSets").value)||3),
        repMin:Math.max(1,parseInt($("nLo").value)||8), repMax:Math.max(1,parseInt($("nHi").value)||10),
        increment:parseFloat(($("nInc").value||"2.5").replace(",","."))||0,
        bodyweight:!!bw,lastWeight:null,active:true,type:"strength",mode:($("nMode")&&$("nMode").value)||"reps"};
      const pl=state.plans.find(p=>p.id===$("nPlan").value); if(pl)pl.exerciseIds.push(id);
      save(); toast("Übung hinzugefügt ✓"); render();
    };
    const ed=$("exportData"); if(ed) ed.onclick=()=>{
      const txt=JSON.stringify(state);
      if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast("In Zwischenablage ✓"),()=>toast("Konnte nicht kopieren"));}
      else toast("Clipboard nicht verfügbar");
    };
  }

  function saveSession(){
    const c=state.checkins[logDate()]||{};
    const entries=[];
    document.querySelectorAll(".card.ex").forEach(card=>{
      const exId=card.dataset.ex; const isTimeEx=state.exercises[exId]&&state.exercises[exId].mode==="time"; const sets=[];
      card.querySelectorAll("table.sets tbody tr").forEach(tr=>{
        const get=f=>{const el=tr.querySelector(`[data-f="${f}"]`); return el?el.value.trim():"";};
        const w=get("weight"), reps=get("reps"), secs=get("secs"), rir=get("rir"), rpe=get("rpe");
        // Ein Satz zählt nur, wenn die Leistung (Wdh. bzw. Zeit) eingetragen ist — ein nur vorausgefülltes Gewicht ist kein absolvierter Satz.
        if(isTimeEx){ if(secs==="") return; } else { if(reps==="") return; }
        let rirV = rir===""?null:parseInt(rir);
        let rpeV = rpe===""?null:parseFloat(rpe.replace(",","."));
        if(rirV==null && rpeV!=null) rirV=Math.round(10-rpeV);   // aus RPE ableiten
        if(rpeV==null && rirV!=null) rpeV=10-rirV;               // aus RIR ableiten
        sets.push({ weight: w===""?null:parseFloat(w.replace(",",".")), reps: reps===""?null:parseInt(reps), secs: secs===""?null:parseInt(secs), rir: rirV, rpe: rpeV });
      });
      const nEl=card.querySelector(".exnote"); const note=nEl?nEl.value.trim():"";
      if(sets.length) entries.push({exerciseId:exId,sets,note:note||null});
    });
    if(!entries.length){toast("Noch nichts erfasst");return;}
    // Rekorde erkennen (geschätztes 1RM vs. alle bisherigen Einheiten außer diesem Tag)
    const prs=[];
    entries.forEach(e=>{ const ex=state.exercises[e.exerciseId]; if(!ex||ex.bodyweight||ex.mode==="time")return;
      const prior=bestE1RMExcl(e.exerciseId, logDate());
      let cur=null,best=null; e.sets.forEach(st=>{ if(st.weight!=null&&st.reps!=null){const ee=epley(st.weight,st.reps); if(cur==null||ee>cur){cur=ee;best=st;}} });
      if(cur!=null && (prior==null || cur>prior+0.05)) prs.push({name:ex.name, w:best.weight, reps:best.reps, e1:Math.round(cur)});
    });
    const wasEditing = state.sessions.some(s=>s.date===logDate() && s.planId===state.ui.planId);
    state.sessions=state.sessions.filter(s=>!(s.date===logDate() && s.planId===state.ui.planId)); // vorhandene Einheit dieses Tags ersetzen
    state.sessions.push({id:uid(),date:logDate(),planId:state.ui.planId,readiness:c.readiness||null,feel:c.feel||null,entries,prs:prs.map(p=>p.name)});
    // lastWeight = Gewicht der chronologisch letzten Einheit je Übung
    entries.forEach(e=>{ const le=lastEntry(e.exerciseId); if(le){const ws=le.sets.map(s=>s.weight).filter(n=>n!=null); if(ws.length) state.exercises[e.exerciseId].lastWeight=Math.max(...ws);} });
    state.ui.extra=[];
    clearDraft();
    save();
    if(prs.length){ prModal(prs); }
    else toast(wasEditing?"Einheit aktualisiert ✓":(logDate()===todayStr()?"Einheit gespeichert ✓":"Einheit nachgetragen ✓"));
    render();
  }
  function prModal(prs){
    const ov=document.createElement("div"); ov.className="overlay";
    const list=prs.map(p=>`<div class="prline"><span>${esc(p.name)}</span><span class="mono">${p.w} kg × ${p.reps} · e1RM ${p.e1}</span></div>`).join("");
    ov.innerHTML=`<div class="modal prmodal"><div class="prtitle">🏆 Neuer Rekord!</div><div class="s" style="color:var(--muted);margin:2px 0 12px">${prs.length>1?`${prs.length} persönliche Bestleistungen`:"Persönliche Bestleistung"} — stark!</div>${list}<div class="mbtns" style="margin-top:14px"><button class="mbtn ok" data-close="1">Weiter so 💪</button></div>`;
    document.body.appendChild(ov); ov.onclick=e=>{if(e.target===ov||e.target.dataset.close)ov.remove();};
    try{ if(navigator.vibrate)navigator.vibrate([120,60,120,60,200]); }catch(e){} beep();
  }

  // ---------- boot ----------
  (async function(){
    const loaded=await load();
    state=loaded||seed();
    if(!state.ui) state.ui={tab:"heute",planId:"mo",weekOffset:0,histEx:"bench"};
    if(!state.checkins){
      state.checkins={};
      if(loaded&&loaded.readiness){ const map={green:"hoch",amber:"niedrig",red:"schlecht"};
        Object.keys(loaded.readiness).forEach(d=>{ state.checkins[d]={readiness:map[loaded.readiness[d]]||null}; }); }
    }
    if(!state.cycle) state.cycle={on:false,model:"dp",start:null,build:3,deload:1};
    if(!state.cycle.model) state.cycle.model="meso";
    if(!state.weights) state.weights=[];
    if(state.weightGoal==null) state.weightGoal=80;
    if(state.ui.restDefault==null) state.ui.restDefault=120;
    if(state.ui.simple==null) state.ui.simple=false;
    if(state.ui.onboarded==null) state.ui.onboarded=true; // bestehende Nutzer nicht mit Onboarding stören
    if(state.ui.tab==="woche"){ state.ui.tab="verlauf"; state.ui.histMode="woche"; } // Woche ist jetzt Unter-Tab von Verlauf
    if(state.ui.skip && state.ui.skip.date!==todayStr()) state.ui.skip=null; // alten Tages-Skip verwerfen
    Object.keys(state.exercises).forEach(id=>{ const ex=state.exercises[id]; if(!ex.pat) ex.pat=guessPat(ex.name); });
    state.ui.weekOffset=0;
    state.ui.logDate=todayStr();
    if(!state.ui.onboarded){ render(); onboardModal(); }
    else render();
    if(!loaded) save();
  })();
})();
</script>

</body>
</html>
